apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: emergency-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: emergency-hub/auth-service:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: ConnectionStrings__AuthDb
          value: "Host=postgres;Port=5432;Database=auth_db;Username=postgres;Password=postgres"
        - name: Jwt__PrivateKeyBase64
          valueFrom:
            secretKeyRef:
              name: emergency-hub-secrets
              key: jwt-private-key
        - name: Jwt__PublicKeyBase64
          valueFrom:
            secretKeyRef:
              name: emergency-hub-secrets
              key: jwt-public-key
        ports:
        - containerPort: 5001
        - containerPort: 5002
        readinessProbe:
          httpGet:
            path: /.well-known/jwks.json
            port: 5002
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: emergency-hub
spec:
  selector:
    app: auth-service
  ports:
  - name: grpc
    port: 5001
    targetPort: 5001
  - name: http
    port: 5002
    targetPort: 5002
