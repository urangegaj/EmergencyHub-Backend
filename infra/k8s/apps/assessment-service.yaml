apiVersion: apps/v1
kind: Deployment
metadata:
  name: assessment-service
  namespace: emergency-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assessment-service
  template:
    metadata:
      labels:
        app: assessment-service
    spec:
      containers:
      - name: assessment-service
        image: emergency-hub/assessment-service:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: ConnectionStrings__AssessmentDb
          value: "Host=postgres;Port=5432;Database=assessment_db;Username=postgres;Password=postgres"
        - name: OpenAI__ApiKey
          valueFrom:
            secretKeyRef:
              name: emergency-hub-secrets
              key: openai-api-key
              optional: true
        ports:
        - containerPort: 5007
---
apiVersion: v1
kind: Service
metadata:
  name: assessment-service
  namespace: emergency-hub
spec:
  selector:
    app: assessment-service
  ports:
  - port: 5007
    targetPort: 5007
