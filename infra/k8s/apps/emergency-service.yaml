apiVersion: apps/v1
kind: Deployment
metadata:
  name: emergency-service
  namespace: emergency-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emergency-service
  template:
    metadata:
      labels:
        app: emergency-service
    spec:
      containers:
      - name: emergency-service
        image: emergency-hub/emergency-service:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: ConnectionStrings__EmergencyDb
          value: "Host=postgres;Port=5432;Database=emergency_db;Username=postgres;Password=postgres"
        ports:
        - containerPort: 5005
---
apiVersion: v1
kind: Service
metadata:
  name: emergency-service
  namespace: emergency-hub
spec:
  selector:
    app: emergency-service
  ports:
  - port: 5005
    targetPort: 5005
