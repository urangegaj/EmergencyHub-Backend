apiVersion: apps/v1
kind: Deployment
metadata:
  name: fire-service
  namespace: emergency-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fire-service
  template:
    metadata:
      labels:
        app: fire-service
    spec:
      containers:
      - name: fire-service
        image: ghcr.io/urangegaj/emergency-hub/fire-service:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: ConnectionStrings__FireDb
          value: "Host=postgres;Port=5432;Database=fire_db;Username=postgres;Password=postgres"
        ports:
        - containerPort: 5003
---
apiVersion: v1
kind: Service
metadata:
  name: fire-service
  namespace: emergency-hub
spec:
  selector:
    app: fire-service
  ports:
  - port: 5003
    targetPort: 5003
