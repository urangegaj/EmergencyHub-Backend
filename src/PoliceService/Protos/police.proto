syntax = "proto3";

option csharp_namespace = "PoliceService";

package police;

enum PoliceCaseStatus {
  OPEN = 0;
  IN_PROGRESS = 1;
  CLOSED = 2;
}

enum PoliceUnitStatus {
  AVAILABLE = 0;
  DEPLOYED = 1;
  OUT_OF_SERVICE = 2;
}

service Police {
  rpc GetCases (GetCasesRequest) returns (GetCasesResponse);
  rpc GetCase (GetCaseRequest) returns (PoliceCaseResponse);
  rpc UpdateCase (UpdateCaseRequest) returns (PoliceCaseResponse);
  rpc GetUnits (GetUnitsRequest) returns (GetUnitsResponse);
  rpc UpdateUnitStatus (UpdateUnitStatusRequest) returns (PoliceUnitResponse);
}

message GetCasesRequest {
  optional PoliceCaseStatus status = 1;
}

message GetCasesResponse {
  repeated PoliceCaseResponse cases = 1;
}

message GetCaseRequest {
  string emergency_id = 1;
}

message PoliceCaseResponse {
  string id = 1;
  string emergency_id = 2;
  string city_id = 3;
  PoliceCaseStatus status = 4;
  optional string assigned_unit_id = 5;
  optional string assigned_unit_name = 6;
  string created_at = 7;
  string updated_at = 8;
  optional string closed_at = 9;
}

message UpdateCaseRequest {
  string emergency_id = 1;
  PoliceCaseStatus status = 2;
  optional string unit_id = 3;
}

message GetUnitsRequest {}

message GetUnitsResponse {
  repeated PoliceUnitResponse units = 1;
}

message PoliceUnitResponse {
  string id = 1;
  string city_id = 2;
  string name = 3;
  PoliceUnitStatus status = 4;
}

message UpdateUnitStatusRequest {
  string unit_id = 1;
  PoliceUnitStatus status = 2;
}
