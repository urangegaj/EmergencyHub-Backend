syntax = "proto3";

option csharp_namespace = "EmergencyService.Grpc";

package emergency;

service Emergency {
  rpc CreateEmergency (CreateEmergencyRequest) returns (EmergencyResponse);
  rpc GetEmergency (GetEmergencyRequest) returns (EmergencyResponse);
  rpc ListEmergencies (ListEmergenciesRequest) returns (ListEmergenciesResponse);
  rpc AssignEmergency (AssignEmergencyRequest) returns (EmergencyResponse);
  rpc PollEmergency (PollEmergencyRequest) returns (EmergencyResponse);
}

message CreateEmergencyRequest {
  string city_id = 1;
  string reported_by_user_id = 2;
  string emergency_type_id = 3;
  string description = 4;
  string address = 5;
}

message GetEmergencyRequest {
  string emergency_id = 1;
  string city_id = 2;
}

message ListEmergenciesRequest {
  string city_id = 1;
  string status = 2;
  string type_name = 3;
  int64 from_ts = 4;
  int64 to_ts = 5;
  string q = 6;
  int32 page = 7;
  int32 page_size = 8;
  string sort_by = 9;
  string order = 10;
}

message ListEmergenciesResponse {
  repeated EmergencyResponse emergencies = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message AssignEmergencyRequest {
  string emergency_id = 1;
  string city_id = 2;
  string assigned_by_user_id = 3;
  repeated string departments = 4;
}

message PollEmergencyRequest {
  string emergency_id    = 1;
  string city_id         = 2;
  int32  since           = 3;
  int32  timeout_seconds = 4;
}

message EmergencyResponse {
  string id = 1;
  string city_id = 2;
  string reported_by_user_id = 3;
  string emergency_type_id = 4;
  string emergency_type_name = 5;
  string description = 6;
  string address = 7;
  string status = 8;
  int32 version = 9;
  string created_at = 10;
  string updated_at = 11;
  repeated AssignmentResponse assignments = 12;
}

message AssignmentResponse {
  string id = 1;
  string department_type = 2;
  string assigned_at = 3;
  optional string closed_at = 4;
}
