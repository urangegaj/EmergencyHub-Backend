services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-connect:
    build: ./infra/kafka-connect
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: emergency-hub-connect
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect

  postgres:
    image: postgres:16
    command: postgres -c wal_level=logical
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  auth-service:
    build:
      context: .
      dockerfile: src/AuthService/Dockerfile
    ports:
      - "5001:5001"
      - "5002:5002"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__AuthDb: "Host=postgres;Port=5432;Database=auth_db;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__PrivateKeyBase64: "${JWT_PRIVATE_KEY}"
      Jwt__PublicKeyBase64: "${JWT_PUBLIC_KEY}"
    depends_on:
      postgres:
        condition: service_healthy

  emergency-service:
    build:
      context: .
      dockerfile: src/EmergencyService/Dockerfile
    ports:
      - "5005:5005"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__EmergencyDb: "Host=postgres;Port=5432;Database=emergency_db;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      Kafka__BootstrapServers: "kafka:29092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  police-service:
    build:
      context: .
      dockerfile: src/PoliceService/Dockerfile
    ports:
      - "5004:5004"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PoliceDb: "Host=postgres;Port=5432;Database=police_db;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      Kafka__BootstrapServers: "kafka:29092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  fire-service:
    build:
      context: .
      dockerfile: src/FireService/Dockerfile
    ports:
      - "5003:5003"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FireDb: "Host=postgres;Port=5432;Database=fire_db;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      Kafka__BootstrapServers: "kafka:29092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  medical-service:
    build:
      context: .
      dockerfile: src/MedicalService/Dockerfile
    ports:
      - "5006:5006"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MedicalDb: "Host=postgres;Port=5432;Database=medical_db;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      Kafka__BootstrapServers: "kafka:29092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: src/NotificationService/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__NotificationDb: "Host=postgres;Port=5432;Database=notification_db;Username=postgres;Password=postgres"
      Kafka__BootstrapServers: "kafka:29092"
      Smtp__Host: "mailpit"
      Smtp__Port: "1025"
      Services__AuthService: "http://auth-service:5001"
      Services__EmergencyService: "http://emergency-service:5005"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      auth-service:
        condition: service_started
      emergency-service:
        condition: service_started

  assessment-service:
    build:
      context: .
      dockerfile: src/AssessmentService/Dockerfile
    ports:
      - "5007:5007"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__AssessmentDb: "Host=postgres;Port=5432;Database=assessment_db;Username=postgres;Password=postgres"
      Kafka__BootstrapServers: "kafka:29092"
      Services__FireService: "http://fire-service:5003"
      Services__PoliceService: "http://police-service:5004"
      Services__EmergencyService: "http://emergency-service:5005"
      Services__MedicalService: "http://medical-service:5006"
      OpenAI__ApiKey: "${OPENAI_API_KEY}"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
    ports:
      - "5158:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Redis: "redis:6379"
      Jwt__JwksUri: "http://auth-service:5002/.well-known/jwks.json"
      Services__AuthService: "http://auth-service:5001"
      Services__EmergencyService: "http://emergency-service:5005"
      Services__FireService: "http://fire-service:5003"
      Services__PoliceService: "http://police-service:5004"
      Services__MedicalService: "http://medical-service:5006"
      Services__AssessmentService: "http://assessment-service:5007"
    depends_on:
      auth-service:
        condition: service_started
      emergency-service:
        condition: service_started
      police-service:
        condition: service_started
      fire-service:
        condition: service_started
      medical-service:
        condition: service_started
      assessment-service:
        condition: service_started

volumes:
  postgres_data:
